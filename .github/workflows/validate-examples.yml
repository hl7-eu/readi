# Daily non-regression validation of the examples/ folder against the
# current READI profiles. Independent from the IG build: it only runs SUSHI
# to obtain the profiles and then the HL7 FHIR Java validator.
name: Validate examples

on:
  schedule:
    - cron: "0 5 * * *" # every day at 05:00 UTC; skipped if nothing was pushed
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no new commit since the last run"
        type: boolean
        default: true
      update_baseline:
        description: "Produce a new baseline from this run (download it from the artifacts and commit it)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-examples
  cancel-in-progress: true

env:
  VALIDATOR_VERSION: "7.0.3" # bump deliberately, then refresh the baseline
  SUSHI_VERSION: "3.21.0"
  FHIR_VERSION: "4.0.1"
  TX_SERVER: "https://tx.fhir.org" # use "n/a" to skip terminology checks
  # Packages the examples need besides the READI profiles
  EXTRA_IGS: "hl7.fhir.uv.xver-r5.r4#0.1.0"
  BASELINE: scripts/validation/baseline.json

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last_sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate-examples.yml \
            --branch "$GITHUB_REF_NAME" --status completed --limit 20 \
            --json headSha,databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].headSha // \"\"")
          if [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "No new commit since the last run ($last_sha), skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: check-changes
    if: needs.check-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache validator and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            ~/validator
            ~/.fhir/packages
          key: fhir-${{ env.VALIDATOR_VERSION }}-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-${{ env.VALIDATOR_VERSION }}-

      - name: Download validator
        run: |
          mkdir -p ~/validator
          jar=~/validator/validator_cli-${VALIDATOR_VERSION}.jar
          [ -f "$jar" ] || curl -sSfL -o "$jar" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          echo "VALIDATOR_JAR=$jar" >> "$GITHUB_ENV"

      - name: Generate profiles (SUSHI)
        run: npx --yes fsh-sushi@${SUSHI_VERSION} .

      - name: Run validator
        run: |
          mkdir -p validation-output
          mapfile -t files < <(find examples -type f \( -name '*.json' -o -name '*.xml' \) | sort)
          echo "Validating ${#files[@]} examples"
          igs=()
          for ig in $EXTRA_IGS; do igs+=(-ig "$ig"); done
          # The validator exits non-zero when it finds errors; the report step decides pass/fail
          java -Xmx4g -jar "$VALIDATOR_JAR" "${files[@]}" \
            -version "$FHIR_VERSION" \
            "${igs[@]}" -ig fsh-generated/resources \
            -tx "$TX_SERVER" \
            -output validation-output/results.json \
            -html-output validation-output/results.html \
            | tee validation-output/validator.log || true
          test -s validation-output/results.json

      - name: Build report
        id: report
        run: |
          extra=()
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            extra+=(--update-baseline)
          fi
          python scripts/validation/report.py validation-output/results.json \
            --baseline "$BASELINE" \
            --report validation-output/report.md \
            --context "Commit=${GITHUB_SHA::7} ($(git log -1 --format='%s' | head -c 80))" \
            --context "Validator=${VALIDATOR_VERSION}" \
            --context "Terminology=${TX_SERVER}" \
            --context "Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${extra[@]}"
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            cp "$BASELINE" validation-output/baseline.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_number }}
          path: validation-output/
          retention-days: 90
